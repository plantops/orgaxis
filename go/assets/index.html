<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrgAxis Workspace — Workforce Intelligence</title>
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-symbol"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 3 32 11v14L18 33 4 25V11Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M18 3v30M4 11l28 14M32 11 4 25" stroke="currentColor" stroke-width="1.5" opacity=".55"/><circle cx="18" cy="18" r="4" fill="currentColor"/></svg></div><div><div class="brand-name">ORGAXIS<span class="brand-dot">.</span></div><div class="brand-sub">WORKFORCE INTELLIGENCE</div></div></div>
    <div class="tenant-switch"><div class="tenant-icon">CF</div><div class="tenant-label"><b>Cement Factory Pilot</b><span>Demo organization · 1 company</span></div><span class="down-chevron">⌄</span></div>
    <nav id="nav" aria-label="Primary navigation">
      <div class="nav-group">WORKSPACE</div>
      <button class="nav-link active" data-view="dashboard"><span class="nav-ico">◫</span><span>Tổng quan</span></button>
      <button class="nav-link" data-view="organization"><span class="nav-ico">◇</span><span>Cơ cấu tổ chức</span><span class="nav-extra">LIVE</span></button>
      <button class="nav-link" data-view="people"><span class="nav-ico">♙</span><span>Nhân sự</span></button>
      <div class="nav-group">TALENT & PERFORMANCE</div>
      <button class="nav-link" data-view="skills"><span class="nav-ico">◎</span><span>Năng lực & kỹ năng</span></button>
      <button class="nav-link" data-view="training"><span class="nav-ico">▤</span><span>Đào tạo & chứng chỉ</span></button>
      <button class="nav-link" data-view="performance"><span class="nav-ico">▥</span><span>KPI & hiệu suất</span></button>
      <div class="nav-group">PEOPLE OPERATIONS</div>
      <button class="nav-link" data-view="absences"><span class="nav-ico">▣</span><span>Nghỉ phép & vắng mặt</span></button>
      <button class="nav-link" data-view="workflow"><span class="nav-ico">⇢</span><span>Phê duyệt & workflow</span></button>
      <button class="nav-link" data-view="recognition"><span class="nav-ico">✧</span><span>Khen thưởng</span></button>
      <button class="nav-link" data-view="discipline"><span class="nav-ico">▧</span><span>Hồ sơ kỷ luật</span></button>
      <button class="nav-link" data-view="occupational"><span class="nav-ico">⬡</span><span>Nghề & điều kiện lao động</span></button>
      <div class="nav-group">PLANNED EXTENSIONS</div>
      <button class="nav-link" data-view="payroll"><span class="nav-ico">₫</span><span>Lương · BHXH · Thuế</span><span class="nav-extra">RECORD</span></button>
      <button class="nav-link" data-view="immigration"><span class="nav-ico">◇</span><span>Chuyên gia nước ngoài</span><span class="nav-extra">RECORD</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="local-dot"></div><div><b>LOCAL PILOT</b><span>SQLite · Synthetic data only</span></div><a href="/docs" title="API documentation">↗</a></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="top-left"><button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar">☰</button><span class="breadcrumb">ORGAXIS</span><span class="bread-sep">/</span><strong id="topTitle">Tổng quan</strong></div><div class="top-right"><div class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Tìm nhân sự / mã NV..." aria-label="Global search"><kbd>ENTER</kbd></div><div class="date-control"><span class="date-icon">◷</span><label for="asof" class="sr-only">Effective date</label><input type="date" id="asof" value="2026-11-18"></div><span class="demo-chip">DEMO</span></div></header>
    <main id="content"><div class="loading-shell"><span class="loading-ring"></span><h2>Đang tải dữ liệu...</h2></div></main>
  </div>
</div>
<div id="drawerBackdrop" class="drawer-backdrop" hidden></div><aside id="drawer" class="drawer" aria-label="Personnel details" hidden><div id="drawerContent"></div></aside>
<div id="modalBackdrop" class="modal-backdrop" hidden></div><div id="modal" class="modal" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script defer src="/assets/app.js"></script>
</body></html>
